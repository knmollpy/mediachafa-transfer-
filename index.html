
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaChafa</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0d12; color: #f3f4f6;
      font-family: Arial, sans-serif; padding: 20px;
    }
    .panel {
      width: 100%; max-width: 390px; padding: 28px;
      background: #151922; border: 1px solid #292f3b;
      border-radius: 18px;
    }
    h1 { margin: 0 0 8px; }
    p { color: #a5adbb; line-height: 1.5; }
    input, button {
      width: 100%; padding: 13px; margin-top: 12px;
      border-radius: 9px; font-size: 15px;
    }
    input {
      background: #0b0d12; border: 1px solid #343b49;
      color: white; outline: none;
    }
    button {
      border: 0; background: #65e6a4; color: #092016;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #292f3b; color: white; }
    #message { overflow-wrap: anywhere; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>MediaChafa</h1>
    <p>Tu espacio compartido de archivos.</p>

    <section id="auth">
      <input id="username" placeholder="Nombre de usuario" autocomplete="username">
      <input id="email" type="email" placeholder="Correo electrónico" autocomplete="email">
      <input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password">
      <button id="register">Crear cuenta</button>
      <button id="login" class="secondary">Iniciar sesión</button>
    </section>

    <section id="account" class="hidden">
      <h2 id="welcome"></h2>
      <p>Sesión iniciada correctamente.</p>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://velxgwkujcabdaxbppyj.supabase.co";
    const SUPABASE_KEY = "PEGA_AQUI_TU_CLAVE_PUBLISHABLE";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const $ = id => document.getElementById(id);
    const message = text => $("message").textContent = text;

    function showAccount(user) {
      $("auth").classList.toggle("hidden", !!user);
      $("account").classList.toggle("hidden", !user);
      $("welcome").textContent = user ? "¡Bienvenido!" : "";
    }

    $("register").onclick = async () => {
      const username = $("username").value.trim();
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!username || !email || password.length < 6) {
        return message("Completá usuario, correo y una contraseña de al menos 6 caracteres.");
      }

      message("Creando cuenta...");
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) return message(error.message);

      if (data.session) {
        message("Cuenta creada correctamente.");
      } else {
        message("Cuenta creada. Revisá tu correo para confirmar el registro.");
      }
    };

    $("login").onclick = async () => {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) return message("Ingresá tu correo y contraseña.");

      message("Iniciando sesión...");
      const { data, error } = await client.auth.signInWithPassword({
        email, password
      });

      if (error) return message(error.message);
      showAccount(data.user);
      message("Sesión iniciada.");
    };

    $("logout").onclick = async () => {
      const { error } = await client.auth.signOut();
      if (error) return message(error.message);
      showAccount(null);
      message("Sesión cerrada.");
    };

    client.auth.onAuthStateChange((_event, session) => {
      showAccount(session?.user ?? null);
    });

    client.auth.getSession().then(({ data }) => {
      showAccount(data.session?.user ?? null);
    });
  </script>
</body>
</html>
