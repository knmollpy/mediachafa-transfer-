plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mediachafa.beta'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mediachafa.beta'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
    }
    buildTypes { debug { applicationIdSuffix ''; versionNameSuffix '-beta' }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
