name = "mediachafa-beta-ai"
main = "worker.js"
compatibility_date = "2026-10-28"
workers_dev = true
usage_model = "standard"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "BETA_LIMITS"
id = "6f8bada8702645e5987bbdd23b42424c"

[assets]
directory = "./static"
run_worker_first = false
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "DISCORD_GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordGateway"]


[triggers]
crons = ["*/5 * * * *"]
