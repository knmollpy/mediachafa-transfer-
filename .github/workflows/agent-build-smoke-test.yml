name: Agent APK and PS4 PKG smoke test
on:
  push:
    branches:
      - beta-agent/agent-build-smoke-test-20261116
    paths:
      - "app-source/apk/agent-smoke/**"
      - "app-source/ps4/agent-smoke/**"
      - ".github/workflows/agent-build-smoke-test.yml"
permissions:
  actions: write
  contents: read
jobs:
  dispatch-real-build-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch both real agent build workflows
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\\/heads\\//, "");
            const common = { owner: context.repo.owner, repo: context.repo.repo, ref: branch, inputs: { execution_id: `smoke-${context.runId}` } };
            await github.rest.actions.createWorkflowDispatch({ ...common, workflow_id: "agent-build-apk.yml", inputs: { ...common.inputs, project_path: "app-source/apk/agent-smoke" } });
            await github.rest.actions.createWorkflowDispatch({ ...common, workflow_id: "agent-build-ps4-pkg.yml", inputs: { ...common.inputs, project_path: "app-source/ps4/agent-smoke" } });
            core.info(`Dispatched APK and PKG builds for ${branch}`);
