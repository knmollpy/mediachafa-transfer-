name: Build standalone Android APK for Beta agent

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Beta autonomous execution ID
        required: false
        type: string
      project_path:
        description: Android project directory inside app-source/apk/
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-agent-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate and build standalone Android project
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          if [[ ! "$PROJECT_PATH" =~ ^app-source/apk/[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
            echo "project_path must be app-source/apk/<lowercase-project-name>" >&2
            exit 1
          fi
          if [ ! -f "$PROJECT_PATH/settings.gradle" ] && [ ! -f "$PROJECT_PATH/settings.gradle.kts" ]; then
            echo "Project requires settings.gradle or settings.gradle.kts" >&2
            exit 1
          fi
          if [ ! -f "$PROJECT_PATH/app/build.gradle" ] && [ ! -f "$PROJECT_PATH/app/build.gradle.kts" ]; then
            echo "Project requires app/build.gradle or app/build.gradle.kts" >&2
            exit 1
          fi
          gradle --no-daemon -p "$PROJECT_PATH" assembleDebug
          mkdir -p "$RUNNER_TEMP/apk-output"
          find "$PROJECT_PATH/app/build/outputs/apk/debug" -maxdepth 1 -type f -name "*.apk" -size +0c -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          if ! find "$RUNNER_TEMP/apk-output" -maxdepth 1 -type f -name "*.apk" -size +0c | grep -q .; then
            echo "Gradle finished without producing a non-empty debug APK." >&2
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-android-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
