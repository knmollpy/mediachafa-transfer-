name: Build Android APK for Beta agent

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Beta autonomous execution ID
        required: false
        type: string
      project_path:
        description: Optional standalone Android project inside app-source/apk/
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: beta-agent-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        if: ${{ inputs.project_path != '' }}
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ inputs.project_path != '' }}
        with:
          gradle-version: "8.9"
      - name: Build standalone Android project or MediaChafa app
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-output"
          if [ -n "$PROJECT_PATH" ]; then
            if [[ ! "$PROJECT_PATH" =~ ^app-source/apk/[a-z0-9][a-z0-9._-]{0,63}$ ]]; then
              echo "project_path must be app-source/apk/<lowercase-project-name>" >&2
              exit 1
            fi
            if [ ! -f "$PROJECT_PATH/settings.gradle" ] && [ ! -f "$PROJECT_PATH/settings.gradle.kts" ]; then
              echo "Standalone Android project requires settings.gradle or settings.gradle.kts" >&2
              exit 1
            fi
            if [ ! -f "$PROJECT_PATH/app/build.gradle" ] && [ ! -f "$PROJECT_PATH/app/build.gradle.kts" ]; then
              echo "Standalone Android project requires app/build.gradle or app/build.gradle.kts" >&2
              exit 1
            fi
            gradle --no-daemon -p "$PROJECT_PATH" assembleDebug
            find "$PROJECT_PATH/app/build/outputs/apk/debug" -maxdepth 1 -type f -name "*.apk" -size +0c -exec cp {} "$RUNNER_TEMP/apk-output/" \;
          else
            npm install --no-audit --no-fund
            npm run mobile:copy
            npx cap add android
            sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode 254/" android/app/build.gradle
            sed -i -E "s/versionName[[:space:]]+"[^"]+"/versionName "2.5.4"/" android/app/build.gradle
            sed -i '/dependencies[[:space:]]*{/a\    implementation "org.apache.ftpserver:ftpserver-core:1.2.1"\n    implementation "commons-net:commons-net:3.13.0"' android/app/build.gradle
            echo "android.packaging.resources.excludes += ['META-INF/DEPENDENCIES']" >> android/app/build.gradle
            mkdir -p android/app/src/main/java/com/mediachafa/app
            cp mobile/android/DownloadLocationPlugin.java android/app/src/main/java/com/mediachafa/app/
            cp mobile/android/ExternalLinkPlugin.java android/app/src/main/java/com/mediachafa/app/
            cp mobile/android/MediaFtpPlugin.java android/app/src/main/java/com/mediachafa/app/
            cp mobile/android/FtpServerService.java android/app/src/main/java/com/mediachafa/app/
            cp mobile/android/MainActivity.java android/app/src/main/java/com/mediachafa/app/
            python3 - <<'PY'
            from pathlib import Path
            p = Path("android/app/src/main/AndroidManifest.xml")
            s = p.read_text()
            permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.CHANGE_NETWORK_STATE", "android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE"]
            for permission in permissions:
                if permission not in s:
                    s = s.replace("<application", f'<uses-permission android:name="{permission}" />\n    <application', 1)
            service = '    <service android:name=".FtpServerService" android:enabled="true" android:exported="false" android:foregroundServiceType="connectedDevice" />'
            if "FtpServerService" not in s:
                s = s.replace("</application>", service + "\n  </application>", 1)
            p.write_text(s)
            PY
            npm run mobile:sync
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk-output/MediaChafa.apk"
          fi
          if ! find "$RUNNER_TEMP/apk-output" -maxdepth 1 -type f -name "*.apk" -size +0c | grep -q .; then
            echo "No non-empty APK was generated." >&2
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediachafa-android-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
