name: Beta free Blender renderer

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Beta render job identifier
        required: true
        type: string
      prompt:
        description: Scene description
        required: true
        type: string

run-name: Beta Blender ${{ inputs.job_id }}

permissions:
  contents: read

concurrency:
  group: beta-blender-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Build and render scene
        env:
          SCENE_PROMPT: ${{ inputs.prompt }}
        run: |
          mkdir -p "${RUNNER_TEMP}/beta-blender-output"
          cat > "${RUNNER_TEMP}/scene.py" <<'PY'
          import bpy, math, os, re
          from mathutils import Vector
          prompt = os.environ.get("SCENE_PROMPT", "A futuristic 3D scene")
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          scene = bpy.context.scene
          scene.render.engine = 'BLENDER_EEVEE_NEXT' if hasattr(bpy.types, 'EEVEE_NEXT') else 'BLENDER_EEVEE'
          scene.render.resolution_x = 960
          scene.render.resolution_y = 720
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = 'PNG'
          scene.render.film_transparent = False
          scene.world.color = (0.055, 0.07, 0.11)
          def material(name, color, metallic=0.0, roughness=0.35):
              m = bpy.data.materials.new(name); m.diffuse_color = (*color, 1)
              m.use_nodes = True; bs = m.node_tree.nodes.get('Principled BSDF')
              bs.inputs['Base Color'].default_value = (*color, 1)
              bs.inputs['Metallic'].default_value = metallic
              bs.inputs['Roughness'].default_value = roughness
              return m
          mats = [material('Electric cyan', (0.025,0.55,0.8), .55), material('Warm gold', (.95,.38,.06), .45), material('Violet', (.32,.12,.72), .35), material('Pearl', (.78,.84,.92), .15)]
          lower = prompt.lower()
          if any(k in lower for k in ['dragon','dragón','bird','pájaro','phoenix','fénix']):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=24, ring_count=16, location=(0,0,1.6)); subject=bpy.context.object; subject.name='Flying creature body'; subject.scale=(1.35,.48,.55); subject.data.materials.append(mats[0])
              for side in [-1,1]:
                  bpy.ops.mesh.primitive_cone_add(vertices=24, radius1=.58, radius2=.08, depth=1.9, location=(0,side*.95,2.0), rotation=(side*.35,0,side*.55))
                  wing=bpy.context.object; wing.name='Animated wing'; wing.data.materials.append(mats[2])
                  wing.rotation_euler[0]=side*.35
                  wing.keyframe_insert(data_path='rotation_euler',frame=1)
                  wing.rotation_euler[0]=side*-.35; wing.keyframe_insert(data_path='rotation_euler',frame=36)
              for x in [-.65,.65]:
                  bpy.ops.mesh.primitive_uv_sphere_add(segments=16, ring_count=12, location=(x,-.42,1.92)); eye=bpy.context.object; eye.scale=(.12,.08,.12); eye.data.materials.append(mats[1])
          elif any(k in lower for k in ['car','auto','coche','vehicle','vehículo']):
              bpy.ops.mesh.primitive_cube_add(size=1, location=(0,0,.85)); subject=bpy.context.object; subject.scale=(1.65,.72,.42); subject.data.materials.append(mats[0])
              for x in [-1.05,1.05]:
                  for y in [-.58,.58]:
                      bpy.ops.mesh.primitive_torus_add(major_radius=.28,minor_radius=.1,location=(x,y,.42),rotation=(math.pi/2,0,0)); bpy.context.object.data.materials.append(mats[1])
          elif any(k in lower for k in ['planet','planeta','moon','luna','earth','tierra']):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=48, ring_count=32, location=(0,0,1.5)); subject=bpy.context.object; subject.scale=(1.25,1.25,1.25); subject.data.materials.append(mats[0])
              bpy.ops.mesh.primitive_torus_add(major_radius=1.8,minor_radius=.07,location=(0,0,1.5),rotation=(.35,.15,.2)); bpy.context.object.data.materials.append(mats[1])
          else:
              if any(k in lower for k in ['monkey','mono','character','personaje']):
                  bpy.ops.mesh.primitive_monkey_add(location=(0,0,1.25))
              elif any(k in lower for k in ['ring','anillo','torus']):
                  bpy.ops.mesh.primitive_torus_add(major_radius=1,minor_radius=.32,location=(0,0,1.25))
              elif any(k in lower for k in ['sphere','esfera','ball','pelota']):
                  bpy.ops.mesh.primitive_uv_sphere_add(segments=40,ring_count=24,location=(0,0,1.25))
              else:
                  bpy.ops.mesh.primitive_cube_add(size=1.7,location=(0,0,1.25))
              subject=bpy.context.object; subject.name='Main subject'; subject.data.materials.append(mats[0])
          subject.rotation_euler=(0,0,0); subject.keyframe_insert(data_path='rotation_euler',frame=1)
          subject.rotation_euler[2]=math.tau; subject.keyframe_insert(data_path='rotation_euler',frame=36)
          subject.location.z += .35; subject.keyframe_insert(data_path='location',frame=18)
          subject.location.z -= .35; subject.keyframe_insert(data_path='location',frame=36)
          for f in scene.objects:
              if f.animation_data and f.animation_data.action:
                  for fc in f.animation_data.action.fcurves:
                      for kp in fc.keyframe_points: kp.interpolation='BEZIER'
          bpy.ops.mesh.primitive_plane_add(size=200, location=(0,0,0)); floor=bpy.context.object; floor.name='Ground'; floor.data.materials.append(material('Midnight floor',(.018,.025,.045),.25,.55))
          bpy.ops.object.text_add(location=(-3.6,-.1,.04),rotation=(math.pi/2,0,0))
          title=bpy.context.object; title.data.body=prompt[:70]; title.data.size=.32; title.data.extrude=.004; title.data.materials.append(mats[3])
          def aim(obj, target): obj.rotation_euler=(Vector(target)-obj.location).to_track_quat('-Z','Y').to_euler()
          bpy.ops.object.camera_add(location=(5,-8,5.2)); cam=bpy.context.object; aim(cam,(0,0,1)); scene.camera=cam; cam.data.lens=52
          for loc,power,size,color in [((1,-4,7),1500,5,(.35,.75,1)),((-4,1,4),1100,4,(.55,.25,1)),((4,3,5),1700,3,(1,.48,.18))]:
              bpy.ops.object.light_add(type='AREA',location=loc); light=bpy.context.object; light.data.energy=power; light.data.shape='DISK'; light.data.size=size; light.data.color=color; aim(light,(0,0,1))
          scene.frame_start=1; scene.frame_end=36; scene.render.fps=18
          scene.view_settings.view_transform='Standard'
          scene.render.filepath=os.path.join(os.environ['RUNNER_TEMP'],'beta-blender-output','frame.png')
          scene.frame_set(1)
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(os.environ['RUNNER_TEMP'],'beta-blender-output','scene.blend'))
          bpy.ops.render.render(write_still=True)
          scene.render.image_settings.file_format='FFMPEG'
          scene.render.ffmpeg.format='MPEG4'
          scene.render.filepath=os.path.join(os.environ['RUNNER_TEMP'],'beta-blender-output','animation')
          scene.frame_set(1)
          bpy.ops.render.render(animation=True)
          PY
          blender -b --python "${RUNNER_TEMP}/scene.py"
          test -s "${RUNNER_TEMP}/beta-blender-output/frame.png"
          test -s "${RUNNER_TEMP}/beta-blender-output/scene.blend"
      - name: Upload render files
        uses: actions/upload-artifact@v4
        with:
          name: beta-blender-${{ inputs.job_id }}
          path: ${{ runner.temp }}/beta-blender-output/*
          if-no-files-found: error
          retention-days: 1
